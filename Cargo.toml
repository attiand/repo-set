[package]
name = "repo-set"
version = "0.16.0"
edition = "2024"


[dependencies]
git2 = { version = "0.21.0", features = ["ssh", "https"] }
clap = { version = "4.6.8", features = ["derive"] }
anyhow = "1.0.104"
humantime = "2.4.0"
glob = "0.3"
crossbeam-channel = "0.5"
console = "0.16.6"
toml = "1.2.1"
serde = { version ="1.0.229", features = ["derive"]}
clap_complete = { version = "4.6.12", features = ["unstable-dynamic"] }
